# Publishes the attendee guide (guide/) to its own Azure Static Web App.
#
# This is the instructor's site: deploy it once and give attendees the URL, so they can read
# Step 0 before they have an Azure subscription of their own. It is deliberately separate from
# the workshop app in src/ + api/, which each attendee deploys themselves in guide Step 7.
#
# Setup, once:
#   1. Create a Static Web App on the Free plan, with "Other" as the deployment source.
#   2. On it, select "Manage deployment token" and copy the token.
#   3. In this repository: Settings > Secrets and variables > Actions > New repository secret,
#      named AZURE_STATIC_WEB_APPS_API_TOKEN_GUIDE.
#
# There is no API and nothing to build, so the guide folder ships exactly as it is.
name: Deploy workshop guide

on:
  push:
    branches: [main]
    paths:
      - "guide/**"
      - ".github/workflows/deploy-guide.yml"
  workflow_dispatch:

concurrency:
  group: deploy-guide
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy guide
    steps:
      - uses: actions/checkout@v4

      - name: Fail early if the deployment token is missing
        env:
          TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GUIDE }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::AZURE_STATIC_WEB_APPS_API_TOKEN_GUIDE is not set."
            echo "Add it under Settings > Secrets and variables > Actions."
            echo "See the comment at the top of this workflow file."
            exit 1
          fi

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GUIDE }}
          action: upload
          app_location: guide
          api_location: ""
          output_location: ""
          skip_app_build: true
